name: myapp
description: BDPHS Student Management App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2

  # File Handling
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_pdfview: ^1.3.2      # ← PDF in-app viewer

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  pdf: ^3.11.1
  printing: ^5.13.2
  qr_flutter: ^4.1.0
  table_calendar: ^3.1.2
  path_provider: ^2.1.4

  # AI & Network
  http: ^1.2.2
  google_generative_ai: ^0.4.6
  url_launcher: ^6.3.1

  # State Management
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  flutter_launcher_icons: ^0.13.1

flutter:

  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:

  android: true
  ios: true

  image_path: "assets/images/bdphs.png"

  min_sdk_android: 21

  adaptive_icon_background: "#FFFFFF"

  adaptive_icon_foreground: "assets/images/bdphs.png"

  adaptive_icon_factor: 0.7